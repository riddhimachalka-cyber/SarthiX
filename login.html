<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0F7B6A" />
  <meta name="description" content="SarthiX — Multilingual Voice Assistant for Rural Citizens. Sign in to continue." />

  <title>SarthiX — Sign In</title>

  <link rel="icon" type="image/svg+xml" href="assets/logo/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a class="skip-link" href="#auth-panel" data-en="Skip to form">फॉर्म पर जाएइ</a>

  <div class="auth-shell">
    <div class="auth-panel" id="auth-panel" role="dialog" aria-modal="true" aria-labelledby="auth-title-login">
      <!-- ═══════════ LEFT PANEL ═══════════ -->
      <aside class="auth-left">
        <div class="auth-left-bg" aria-hidden="true">
          <img src="assets/images/hero-farmer.jpg" alt="" />
          <div class="auth-left-shade"></div>
        </div>

        <div class="auth-left-content">
          <div class="auth-brand">
            <span class="auth-brand-mark" aria-hidden="true">
              <img src="assets/logo/logo-mark.svg" alt="" />
            </span>
            <span class="auth-brand-name">Sarthi<span class="brand-x">X</span></span>
          </div>

          <p class="auth-tagline">Your Voice. Your Rights. Your Opportunities.</p>
          <p class="auth-quote">&ldquo;Empowering Rural India&rdquo;</p>
        </div>

        <div class="auth-visual" aria-hidden="true">
          <div class="auth-mic-ring"></div>
          <div class="auth-mic-ring auth-mic-ring--second"></div>
          <div class="auth-mic-core">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 2a7 7 0 0 0-7 7v4a7 7 0 0 0 7 7 7 7 0 0 0 7-7v-4a7 7 0 0 0-7-7" />
              <path d="M12 19v3M12 14v3" />
            </svg>
          </div>
          <div class="auth-sound-waves" role="img" aria-label="Sound waves">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </aside>

      <!-- ═══════════ RIGHT PANEL ═══════════ -->
      <section class="auth-right" aria-label="Authentication">
        <div class="auth-lang">
          <div class="lang" data-lang>
            <button class="lang-btn" type="button" id="lang-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="lang-menu">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <path d="M3.6 9h16.8M3.6 15h16.8" />
                <path d="M12 3c2.4 2.5 3.6 5.6 3.6 9S14.4 18.5 12 21c-2.4-2.5-3.6-5.6-3.6-9S9.6 5.5 12 3Z" />
              </svg>
              <span class="lang-current" id="lang-current">English</span>
              <svg class="lang-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m6 9 6 6 6-6" />
              </svg>
            </button>

            <div class="lang-menu" id="lang-menu" role="listbox" aria-labelledby="lang-btn">
              <button class="lang-option" type="button" role="option" aria-selected="true" data-lang="en">
                <span class="lang-native">English</span>
                <span class="lang-en">English</span>
                <svg class="lang-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m5 12.5 4.5 4.5L19 7" />
                </svg>
              </button>
              <button class="lang-option" type="button" role="option" aria-selected="false" data-lang="hi">
                <span class="lang-native">हिन्दी</span>
                <span class="lang-en">Hindi</span>
                <svg class="lang-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m5 12.5 4.5 4.5L19 7" />
                </svg>
              </button>
              <button class="lang-option" type="button" role="option" aria-selected="false" data-lang="mr">
                <span class="lang-native">मराठी</span>
                <span class="lang-en">Marathi</span>
                <svg class="lang-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m5 12.5 4.5 4.5L19 7" />
                </svg>
              </button>
              <button class="lang-option" type="button" role="option" aria-selected="false" data-lang="ta">
                <span class="lang-native">தமிழ்</span>
                <span class="lang-en">Tamil</span>
                <svg class="lang-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m5 12.5 4.5 4.5L19 7" />
                </svg>
              </button>
              <button class="lang-option" type="button" role="option" aria-selected="false" data-lang="gu">
                <span class="lang-native">ગુજરાતી</span>
                <span class="lang-en">Gujarati</span>
                <svg class="lang-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m5 12.5 4.5 4.5L19 7" />
                </svg>
              </button>
              <button class="lang-option" type="button" role="option" aria-selected="false" data-lang="bn">
                <span class="lang-native">বাংলা</span>
                <span class="lang-en">Bengali</span>
                <svg class="lang-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m5 12.5 4.5 4.5L19 7" />
                </svg>
              </button>
            </div>
          </div>
        </div>

        <div class="auth-tabs" role="tablist" aria-label="Authentication type">
          <button class="auth-tab is-active" type="button" role="tab" id="auth-tab-login" aria-selected="true" data-auth-tab="login">Login</button>
          <button class="auth-tab" type="button" role="tab" id="auth-tab-signup" aria-selected="false" data-auth-tab="signup">Sign Up</button>
        </div>

        <div class="auth-forms" id="auth-forms">
          <!-- LOGIN -->
          <section class="auth-form auth-form--login" data-auth-form="login">
            <div class="auth-card">
              <span class="auth-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 2L2 7l10 5 10-5-10-5z" />
                  <path d="M2 17l10 5 10-5" />
                  <path d="M2 12l10 5 10-5" />
                </svg>
                AI-Powered Assistance
              </span>

              <h1 class="auth-title" id="auth-title-login">Welcome back</h1>
              <p class="auth-lead">Sign in to continue your journey with SarthiX.</p>

              <form id="auth-login-form" novalidate>
                <div class="form-group">
                  <label class="form-label" for="auth-login-mobile">Mobile Number</label>
                  <div class="form-input-wrap">
                    <span class="country-code-wrap">+91</span>
                    <input class="form-input with-country" id="auth-login-mobile" type="tel" maxlength="10" inputmode="numeric" placeholder="9876543210" autocomplete="tel" />
                  </div>
                  <p class="error-text" id="auth-login-mobile-error">Please enter a valid 10-digit mobile number.</p>
                </div>

                <div class="form-group">
                  <label class="form-label" for="auth-login-password">Password</label>
                  <div class="form-input-wrap">
                    <input class="form-input" id="auth-login-password" type="password" placeholder="Enter your password" autocomplete="current-password" />
                    <button class="input-icon auth-eye" type="button" id="auth-login-password-toggle" aria-label="Show password" aria-pressed="false">
                      <svg class="auth-eye-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />
                        <circle cx="12" cy="12" r="3" />
                      </svg>
                      <svg class="auth-eye-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                        <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                        <line x1="1" y1="1" x2="23" y2="23" />
                      </svg>
                    </button>
                  </div>
                  <p class="error-text" id="auth-login-password-error">Please enter your password.</p>
                </div>

                <div class="auth-row">
                  <label class="auth-check">
                    <input type="checkbox" id="auth-login-remember" />
                    <span>Remember me</span>
                  </label>
                  <button type="button" class="auth-link" id="auth-login-forgot">Forgot Password?</button>
                </div>

                <p class="auth-error" id="auth-login-error" hidden></p>

                <button class="btn-primary auth-submit" id="auth-login-submit" type="submit">
                  <span class="btn-text">Login</span>
                  <span class="loader" aria-hidden="true"></span>
                </button>

                <div class="signup-divider" style="margin:18px 0;"><span>OR</span></div>
                <button class="btn-secondary" id="auth-login-otp" type="button">Login with OTP</button>

                <div class="signup-divider" style="margin:18px 0;"><span>OR</span></div>
                <button class="btn-google" id="auth-google" type="button">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.52 3.37-4.16 3.37-7.08" />
                    <path fill="#EA4335" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23" />
                    <path fill="#FBBC04" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s0-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12c0 1.77.43 3.45 1.18 4.93l3.66-2.84z" />
                    <path fill="#34A853" d="M12 23c4.3 0 8.01-2.47 9.82-6.16l-3.57-2.77c-.87 2.6-3.29 4.53-6.25 4.53-1.48 0-2.73-.4-3.77-1.06l-3.57 2.77C3.96 21.53 7.68 23 12 23" />
                    <path fill="#4285F4" d="M12 12c-1.48 0-2.73-.4-3.77-1.06l3.57-2.77c.87-2.6 3.29-4.53 6.25-4.53 1.48 0 2.73.4 3.77 1.06l-3.57 2.77c-1.04-.66-2.31-1.06-3.77-1.06-2.86 0-5.29 1.93-6.16 4.53l3.66 2.84c.98-.69 1.74-1.87 2.16-3.19" />
                  </svg>
                  <span>Continue with Google</span>
                </button>
              </form>

              <p class="auth-switch">
                Don&rsquo;t have an account?
                <button type="button" class="auth-link" id="auth-switch-to-signup" data-auth-switch="signup">Create Account</button>
              </p>
            </div>
          </section>

<!-- PART-1-END -->
